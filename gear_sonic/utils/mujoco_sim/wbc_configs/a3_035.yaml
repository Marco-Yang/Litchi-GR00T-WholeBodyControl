# MuJoCo sim config for --robot a3 (AgiBot A3, T2D5 -- the model the 035 policy was trained on), consumed by a3_sim.py.
# The G1 sim speaks Unitree SDK2; the A3 family speaks the A3 body-drive ROS2 contract
# (/body_drive/*_joint_state|_command, */imu/data) so the unmodified C++ a3_deploy_onnx_ref
# runs against MuJoCo exactly as against the real robot.
# Gains are NOT set here: the deploy binary sends kp/kd per joint (035 contract, profile a3_024).
ROBOT_TYPE: 'a3_t2d5'
SIM_BACKEND: 'a3_ros2'
ROBOT_SCENE: "gear_sonic/data/assets/robot_description/mjcf/a3_t2d5.xml"
ROOT_BODY: "pelvis_link"
# topic joint name -> MJCF joint name (same name on A3)
JOINT_ALIAS:
  head_pitch_joint: head_pitch_joint
SIMULATOR: "mujoco"
SIMULATE_DT_DEFAULT: 0.002   # used unless --sim-frequency is changed from its default
VIEWER_DT: 0.02
STATE_PUBLISH_HZ: 250        # deploy side requires per-topic samples fresher than 10 ms
ENABLE_ELASTIC_BAND: True    # hold the robot up until key 9 (same as the G1 sim)
# Pelvis z while hanging. Standing pelvis is ~1.07 m; 1.35 m lifts the feet clear of the floor
# so the bring-up matches G1 (suspended until the operator presses 9).
BAND_HEIGHT: 1.35
VIEWER_DISTANCE: 3.0
ROS_DOMAIN_ID: 87            # dedicated domain, see plan 9.7 (never use the default 0 on a dev machine)
JOINT_ARMATURE_IF_MISSING:   # contract (A3_024) rotor inertia, applied only where the MJCF has armature=0 (A3 T2D5)
  left_hip_pitch_joint: 0.066466
  right_hip_pitch_joint: 0.066466
  waist_yaw_joint: 0.066466
  left_hip_roll_joint: 0.066466
  right_hip_roll_joint: 0.066466
  waist_roll_joint: 0.014621
  left_hip_yaw_joint: 0.066466
  right_hip_yaw_joint: 0.066466
  waist_pitch_joint: 0.088209
  left_knee_joint: 0.120340
  right_knee_joint: 0.120340
  left_shoulder_pitch_joint: 0.012083
  right_shoulder_pitch_joint: 0.012083
  left_ankle_pitch_joint: 0.064441
  right_ankle_pitch_joint: 0.064441
  left_shoulder_roll_joint: 0.012083
  right_shoulder_roll_joint: 0.012083
  left_ankle_roll_joint: 0.020126
  right_ankle_roll_joint: 0.020126
  left_shoulder_yaw_joint: 0.004967
  right_shoulder_yaw_joint: 0.004967
  left_elbow_joint: 0.004967
  right_elbow_joint: 0.004967
  left_wrist_roll_joint: 0.004967
  right_wrist_roll_joint: 0.004967
  left_wrist_pitch_joint: 0.000810
  right_wrist_pitch_joint: 0.000810
  left_wrist_yaw_joint: 0.000810
  right_wrist_yaw_joint: 0.000810
