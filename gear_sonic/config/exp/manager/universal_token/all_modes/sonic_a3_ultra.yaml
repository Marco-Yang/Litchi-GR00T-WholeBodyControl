# @package _global_
# SONIC A3 Ultra, trained with the A3 parameters and randomized over A3 AND A3 Ultra  (what `--robot a3_ultra` trains).
#
# The downloaded 035 policy was trained on the A3 URDF (Litchi a3_024 contract, 29 policy joints) and its domain
# randomization was tuned for A3 and A3 Ultra together, which is why it also runs on the A3 Ultra (README of
# Litchi_sonic_for_a3: "the corresponding models can therefore also run on A3 Ultra").  This experiment is that recipe
# for the A3 Ultra: the 035 contract unchanged -- A3 robot asset and Kp/Kd, rewards, domain randomization, encoders --
# on the Bones-SEED library retargeted onto the A3 itself with the A3 parameters (`a3_29` format: 29 joints, A3 MJCF / limits / foot)
#
#     python gear_sonic/data_process/batch_retarget_bvh_soma_a3ultra.py --robot a3 --tar data/bones_seed/soma_proportional.tar.gz \
#         --output data/motion_lib_a3_29d/robot_filtered_v15_clean --only_from data/motion_lib_a3ultra/robot_filtered_v15_clean --workers 16 \
#         --keep_heading   # ~2 h
#
# `--keep_heading` keeps each clip's capture heading, the world frame of the SMPL data (`smpl_root_ori_b` needs both in one frame).  The g1 / a3_fast
# encoders do not care; a library made without it is turned back with gear_sonic/data_process/restore_a3_heading.py (plan section 17.8).
#
# Everything it exports matches the deploy interface (obs_dict[1,1570] -> action[1,29]); the two Ultra head joints stay at their
# default pose and the fingers are not driven, exactly like the 035 weights on the Ultra.  The SMPL encoder is defined (sonic_a3.yaml) but
# not trained: it needs SMPL motion data (`smpl_motion_file`) and `encoder_sample_probs.smpl > 0`, see docs/workflow/a3_integration_plan.md.
#
# The Ultra's own 63-DOF T3D0 contract is sonic_a3_ultra_t3d0.yaml; it is not deployable.

defaults:
  - /exp/manager/universal_token/all_modes/sonic_a3_035
  - _self_

exp_var: a3ultra_a3params
project_name: TRL_A3Ultra_Track

manager_env:
  commands:
    motion:
      motion_lib_cfg:
        motion_file: data/motion_lib_a3_29d/robot_filtered_v15_clean
