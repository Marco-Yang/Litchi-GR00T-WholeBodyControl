# Teleop-stream stability filter in Isaac (not tracking recorded robot state).
# Reference robot clip is a standing carrier — use height/tilt vs that upright pose
# as fall detectors. Do NOT include foot/ee xyz tracking (false positives when
# the policy walks away following SMPL).

defaults:
  - terms/anchor_pos@_here_
  - terms/anchor_ori_full@_here_
  - terms/motion_time_out@_here_

_target_: gear_sonic.envs.manager_env.mdp.terminations.TerminationsCfg

anchor_pos:
  params:
    threshold: 0.35
    threshold_adaptive: false
    down_threshold: 0.35
    root_height_threshold: 0.5

anchor_ori_full:
  params:
    threshold: 0.85
